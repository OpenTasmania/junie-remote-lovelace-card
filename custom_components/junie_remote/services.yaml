toggle_brave_mode:
  name: Toggle Brave Mode
  description: Enable or disable Brave Mode on a Junie Remote host.
  fields:
    host_key:
      name: Host Key
      description: Deterministic host key slug of the target remote host.
      example: alice_linux_my_project
      selector:
        text:
    entity_id:
      name: Entity
      description: Target entity ID of the Junie Remote host.
      example: switch.alice_linux_my_project_brave_mode
      selector:
        entity:
          integration: junie_remote
    enabled:
      name: Enabled
      description: Whether to enable or disable Brave Mode.
      default: true
      selector:
        boolean:

cleanup_transcripts:
  name: Clean Up Transcripts
  description: Permanently delete provably owned local transcript files and S3 objects for a specific Junie Remote config entry before removing it. (Admin only)
  fields:
    entry_id:
      name: Config Entry ID
      description: The Home Assistant config entry ID whose transcripts should be cleaned up.
      required: true
      example: 01HABCDEF1234567890ABCDEF1
      selector:
        text:
    confirm:
      name: Confirm Deletion
      description: Explicit confirmation to permanently delete all provably owned transcripts for this config entry.
      required: true
      default: false
      selector:
        boolean:

resume_transcripts:
  name: Resume Transcripts
  description: Resume transcript writes for a config entry after cleanup or pause. (Admin only)
  fields:
    entry_id:
      name: Config Entry ID
      description: The Home Assistant config entry ID whose transcript writes should be resumed.
      required: true
      example: 01HABCDEF1234567890ABCDEF1
      selector:
        text:
