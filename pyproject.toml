[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "junie_remote"
version = "0.1.0"
description = "JetBrains Junie Remote Home Assistant integration and Lovelace card"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Peter Lawler" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]
exclude = ["frontend*", "tests*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
